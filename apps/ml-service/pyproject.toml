[project]
name = "ai-mw-ml-service"
version = "0.1.0"
description = "Optional self-hosted ML inference service (embeddings, rerank, generation) for AI Middleware."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "numpy>=2.1,<3",
  "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.2,<4"]
inference = ["transformers>=4.46,<5", "torch>=2.4"]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
